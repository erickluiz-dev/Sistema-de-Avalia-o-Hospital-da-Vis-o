name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend:
    name: Backend - Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Verificar formatação
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "Os seguintes arquivos não estão formatados:"
            echo "$files"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Testes
        run: go test ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Oxfmt
        run: npx oxfmt --check .

      - name: Build
        run: npm run build